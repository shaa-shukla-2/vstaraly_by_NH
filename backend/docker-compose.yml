services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vastralay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-vastralay}
    ports:
      - "5432:5432"
    volumes:
      - vastralay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vastralay} -d ${POSTGRES_DB:-vastralay}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vastralay_pg:
